aid: billogram
name: Billogram
description: >-
  Billogram is a Swedish (Billogram AB) Invoice-to-Cash orchestration platform
  that automates the full invoicing and payment lifecycle for businesses with
  recurring revenue - invoice creation and distribution, digital payment
  collection, customer communication, reminders and dunning, e-invoice
  registration, and financial reporting. It serves the insurance, telecom,
  mobility/parking, and energy sectors. The Billogram v2 API is a RESTful JSON
  API (HTTP Basic Auth) covering customers, billograms/invoices, items, credit
  invoices, payment sources, offers, billing tabs, reports, and HMAC-signed
  webhooks, with separate sandbox and production environments and an official
  Python client library.
